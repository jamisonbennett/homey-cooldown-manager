<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script
      type="text/javascript"
      src="/homey.js"
      data-origin="settings"
    ></script>
    <style>
      .config-errors {
        margin-block-end: 1.25rem;
        padding: 0.75rem 0.9rem;
        border: 1px solid var(--homey-color-border-warning, #f59e0b);
        border-radius: 0.5rem;
        background: var(--homey-color-background-warning, rgba(245, 158, 11, 0.08));
      }

      .config-errors-heading {
        margin: 0 0 0.5rem;
        font-size: 0.95rem;
        font-weight: 600;
      }

      .config-errors-list {
        margin: 0;
        padding-inline-start: 1.1rem;
      }

      .config-errors-item {
        margin-block: 0.35rem;
        line-height: 1.35;
      }

      .trigger-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .trigger-list-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding-block: 0.3rem;
        line-height: 1.25;
      }

      .trigger-key {
        flex: 1 1 auto;
        min-width: 0;
        font-weight: 500;
        overflow-wrap: anywhere;
      }

      .trigger-meta {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 0.15rem;
        text-align: end;
        color: var(--homey-color-text-secondary, #6b7280);
        font-size: 0.875rem;
      }

      .trigger-empty {
        margin: 0;
        color: var(--homey-color-text-secondary, #6b7280);
      }
    </style>
  </head>
  <body>
    <section id="config-errors-section" class="config-errors" hidden>
      <h2
        id="config-errors-heading"
        class="config-errors-heading"
        data-i18n="settings.errors_heading"
      ></h2>
      <ul id="config-errors-list" class="config-errors-list"></ul>
    </section>

    <p id="trigger-empty" class="trigger-empty" hidden data-i18n="settings.empty"></p>
    <ul id="trigger-list" class="trigger-list" hidden></ul>

    <script type="text/javascript" src="format-local-datetime.js"></script>
    <script type="text/javascript">
      var COOLDOWN_SETTINGS_KEY = 'cooldownState';

      function onHomeyReady(Homey) {
        var errorsSection = document.getElementById('config-errors-section');
        var errorsList = document.getElementById('config-errors-list');
        var listElement = document.getElementById('trigger-list');
        var emptyElement = document.getElementById('trigger-empty');
        var hasShown = false;
        var displayContext = null;
        var pendingLoads = 0;

        function showView() {
          if (!hasShown) {
            hasShown = true;
            Homey.ready();
          }
        }

        function beginLoad() {
          pendingLoads += 1;
        }

        function finishLoad() {
          pendingLoads -= 1;
          if (pendingLoads <= 0) {
            showView();
          }
        }

        var SUSPENDED_USED_COUNT = -1;

        function formatDurationSpec(spec) {
          if (spec.invalid) {
            return Homey.__('settings.duration_invalid');
          }

          return spec.duration + ' ' + Homey.__('settings.duration_unit.' + spec.unit);
        }

        function formatAllowUpToLimitSpec(spec) {
          if (spec.invalid) {
            return Homey.__('settings.limit_invalid');
          }

          return spec.maxCount + ' times in ' + formatDurationSpec({
            duration: spec.duration,
            unit: spec.unit,
          });
        }

        function describeConfigError(error) {
          if (error.kind === 'allow_key_conflicting_durations') {
            return Homey.__('settings.error_allow_key_conflicting_durations', {
              key: error.key,
              durations: error.durations.map(formatDurationSpec).join(', '),
            });
          }

          if (error.kind === 'allow_key_invalid_duration') {
            return Homey.__('settings.error_allow_key_invalid_duration', {
              key: error.key,
            });
          }

          if (error.kind === 'allow_up_to_key_conflicting_limits') {
            return Homey.__('settings.error_allow_up_to_key_conflicting_limits', {
              key: error.key,
              limits: error.limits.map(formatAllowUpToLimitSpec).join(', '),
            });
          }

          if (error.kind === 'allow_up_to_key_invalid_limit') {
            return Homey.__('settings.error_allow_up_to_key_invalid_limit', {
              key: error.key,
            });
          }

          if (error.kind === 'grant_tokens_key_invalid_token_count') {
            return Homey.__('settings.error_grant_tokens_key_invalid_token_count', {
              key: error.key,
            });
          }

          if (error.kind === 'allow_key_mixed_card_types') {
            return Homey.__('settings.error_allow_key_mixed_card_types', {
              key: error.key,
            });
          }

          if (error.kind === 'action_key_without_allow') {
            return Homey.__('settings.error_action_key_without_allow', {
              key: error.key,
            });
          }

          if (error.kind === 'trigger_key_without_allow') {
            return Homey.__('settings.error_trigger_key_without_allow', {
              key: error.key,
            });
          }

          return String(error.kind);
        }

        function renderConfigErrors(errors) {
          errorsList.innerHTML = '';

          if (!errors.length) {
            errorsSection.hidden = true;
            return;
          }

          errorsSection.hidden = false;

          errors.forEach(function (error) {
            var item = document.createElement('li');
            item.className = 'config-errors-item';
            item.textContent = describeConfigError(error);
            errorsList.appendChild(item);
          });
        }

        function formatLastRun(timestampMs) {
          if (displayContext) {
            return formatLocalDateTime(
              timestampMs,
              displayContext.timezone,
              displayContext.language,
            );
          }

          return new Intl.DateTimeFormat(undefined, {
            dateStyle: 'short',
            timeStyle: 'medium',
          }).format(new Date(timestampMs));
        }

        function describeLastRun(lastRunAt) {
          if (lastRunAt === null) {
            return Homey.__('settings.never_run');
          }

          return formatLastRun(lastRunAt);
        }

        function describeBlockCount(blockCount) {
          return Homey.__('settings.blocks_since_allow', {
            count: blockCount,
          });
        }

        function describeUsedCount(usedCount) {
          if (usedCount === SUSPENDED_USED_COUNT) {
            return Homey.__('settings.used_count_suspended');
          }

          return Homey.__('settings.used_count', {
            count: usedCount || 0,
          });
        }

        function triggersFromResponse(triggers) {
          return triggers.map(function (trigger) {
            return {
              key: trigger.key,
              lastRunLabel: describeLastRun(trigger.lastRunAt),
              blockCountLabel: describeBlockCount(trigger.blockCount || 0),
              usedCountLabel: describeUsedCount(trigger.usedCount),
            };
          });
        }

        function renderTriggers(triggers) {
          listElement.innerHTML = '';

          if (!triggers.length) {
            listElement.hidden = true;
            emptyElement.hidden = false;
            return;
          }

          emptyElement.hidden = true;
          listElement.hidden = false;

          triggers.forEach(function (trigger) {
            var item = document.createElement('li');
            item.className = 'trigger-list-item';

            var key = document.createElement('span');
            key.className = 'trigger-key';
            key.textContent = trigger.key;

            var meta = document.createElement('div');
            meta.className = 'trigger-meta';

            var time = document.createElement('span');
            time.textContent = trigger.lastRunLabel;

            var blocks = document.createElement('span');
            blocks.textContent = trigger.blockCountLabel;

            var usedCount = document.createElement('span');
            usedCount.textContent = trigger.usedCountLabel;

            meta.appendChild(time);
            meta.appendChild(blocks);
            meta.appendChild(usedCount);
            item.appendChild(key);
            item.appendChild(meta);
            listElement.appendChild(item);
          });
        }

        function loadConfigErrors() {
          beginLoad();

          Homey.api('GET', '/flow-config-errors', null, function (err, response) {
            if (err) {
              Homey.alert(err.message || String(err));
              finishLoad();
              return;
            }

            renderConfigErrors((response && response.errors) || []);
            finishLoad();
          });
        }

        function loadTriggers() {
          beginLoad();

          Homey.api('GET', '/triggers', null, function (err, response) {
            if (err) {
              Homey.alert(err.message || String(err));
              finishLoad();
              return;
            }

            renderTriggers(triggersFromResponse((response && response.triggers) || []));
            finishLoad();
          });
        }

        function loadPage() {
          hasShown = false;
          pendingLoads = 0;
          loadConfigErrors();
          loadTriggers();
        }

        Homey.on('settings.set', function (data) {
          if (!data || data.name === COOLDOWN_SETTINGS_KEY) {
            loadPage();
          }
        });

        Homey.on('settings.unset', function (data) {
          if (!data || data.name === COOLDOWN_SETTINGS_KEY) {
            loadPage();
          }
        });

        Homey.api('GET', '/display-context', null, function (err, context) {
          if (!err && context) {
            displayContext = context;
          }

          loadPage();
        });
      }
    </script>
  </body>
</html>
